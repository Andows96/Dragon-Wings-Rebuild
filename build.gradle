plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.142'
}

group = mod_group_id
version = mod_version
base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

neoForge {
    enable {
        version = project.neo_version
        // Skip NeoForm's decompile/recompile pipeline: it only enriches IDE sources, and the
        // 26.3.0.101 sources currently fail to recompile under the bundled JST (HolderSet error).
        // Compiling our own mod only needs the remapped jar.
        disableRecompilation = true
    }
    validateAccessTransformers = true

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}
